# macOS用アプリ (dmg / zip) のビルド
#
# リリースポリシー (v3.0.0〜): GitHub Release は Windows 版のみ。
#   macOS 版はリリースに添付しない。タグのプッシュでも実行しない。
#
# 実行タイミング:
#   - 手動実行 (workflow_dispatch) のみ → Artifacts に保存 (動作確認用)
#
# 備考:
#   - macOSランナーはコストが高いため、ブランチプッシュでは実行しない
#   - コード署名なし (CSC_IDENTITY_AUTO_DISCOVERY=false で ad-hoc 署名に
#     フォールバック)。初回起動の Gatekeeper 解除は docs/install-macos.md 参照
name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      # Apple Developer証明書を探しに行かず、ad-hoc署名で未署名配布する
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-builder, arm64 + x64)
        # --publish never: electron-builderの自動公開を無効化
        run: npx electron-builder --mac --publish never

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: GMO-TelopGo-macos
          path: |
            dist/*.dmg
            dist/*-mac.zip
          if-no-files-found: error
          retention-days: 3
