# Windows用インストーラ (exe) のビルド
#
# 実行タイミング:
#   - vX.Y.Z タグのプッシュ → ビルドして GitHub Release に exe を添付
#   - 手動実行 (workflow_dispatch) → ビルドして Actions の Artifacts に exe を保存
#   - claude/** ブランチへのプッシュ → 動作確認用ビルド (Artifacts に保存)
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (electron-builder)
        # --publish never: electron-builderの自動公開を無効化 (Release添付は下のステップで行う)
        run: npm run build -- --publish never

      # インストール不要のポータブル版ZIP (win-unpackedをそのまま圧縮)
      # 署名なしexeがSmartScreen等でブロックされる環境向けの代替配布形式
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/GMO-TelopGo-$version-portable-win.zip"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMO-TelopGo-windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMO-TelopGo-windows-portable
          path: dist/*-portable-win.zip
          if-no-files-found: error

      # vX.Y.Z タグの場合は GitHub Release を作成して exe / ポータブルZIP を添付
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*-portable-win.zip
          generate_release_notes: true
