# Windows用インストーラ (exe) のビルド
#
# 実行タイミング:
#   - vX.Y.Z タグのプッシュ → ビルドして GitHub Release に exe を添付
#   - 手動実行 (workflow_dispatch) → Artifacts に保存。release=true なら
#     package.json のバージョンでタグを自動作成し GitHub Release に添付
#   - claude/** ブランチへのプッシュ → 動作確認用ビルド (Artifacts に保存)
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub Releaseを作成して添付する (タグ vX.Y.Z を自動作成)'
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: ['claude/**']

permissions:
  contents: write
  actions: write # 古いArtifactの自動削除に使用

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (electron-builder)
        # --publish never: electron-builderの自動公開を無効化 (Release添付は下のステップで行う)
        run: npm run build -- --publish never

      # インストール不要のポータブル版ZIP (win-unpackedをそのまま圧縮)
      # 署名なしexeがSmartScreen等でブロックされる環境向けの代替配布形式
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/GMO-TelopGo-$version-portable-win.zip"

      # ストレージ枠の節約: 最新2件を残して古いArtifactを削除
      # (使用量の再計算は6〜12時間ごとのため、削除後すぐには枠が空かない点に注意)
      - name: Cleanup old artifacts
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $api = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          $arts = Invoke-RestMethod -Headers $headers "$api`?per_page=100"
          $sorted = $arts.artifacts | Where-Object { -not $_.expired } | Sort-Object created_at -Descending
          $sorted | Select-Object -Skip 2 | ForEach-Object {
            Write-Host "Deleting artifact $($_.name) ($([math]::Round($_.size_in_bytes/1MB))MB, $($_.created_at))"
            Invoke-RestMethod -Method Delete -Headers $headers "$api/$($_.id)" | Out-Null
          }

      # タグビルドはRelease添付が配布経路のためArtifactは省略
      # (Release添付ファイルはActionsのストレージ枠を消費しない)
      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: GMO-TelopGo-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3

      # ポータブル版は手動実行時のみArtifact化 (通常プッシュのストレージ消費を半減)
      - name: Upload portable artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: GMO-TelopGo-windows-portable
          path: dist/*-portable-win.zip
          if-no-files-found: error
          retention-days: 3

      # package.json のバージョンを取得 (手動Release用のタグ名に使用)
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      # vX.Y.Z タグのプッシュ時、または手動実行で release=true の場合に
      # GitHub Release を作成して exe / ポータブルZIP を添付
      # (タグが存在しない場合は現在のコミットに自動作成される)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          files: |
            dist/*.exe
            dist/*-portable-win.zip
          generate_release_notes: true
